name: desktop

on:
  push:
    paths: ["desktop/**", "protocol/**"]
  pull_request:
    paths: ["desktop/**", "protocol/**"]

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
